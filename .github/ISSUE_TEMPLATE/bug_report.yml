name: Bug report
description: Report a repeatable problem in easyRoad.
body:
  - type: markdown
    attributes:
      value: For a security issue, follow SECURITY.md. Do not include credentials or private place files.
  - type: input
    id: version
    attributes:
      label: easyRoad version or commit
    validations:
      required: true
  - type: input
    id: studio
    attributes:
      label: Roblox Studio version and operating system
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include the region, road profile, and tool settings that cause the problem.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result
      description: Include relevant Output messages. Attach a small example only if you can share it.
    validations:
      required: true
