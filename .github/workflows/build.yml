name: Build plugin

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate road and structure geometry
        run: python3 tools/preview/validate.py

      - name: Install Rojo
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v7.6.1 --repo rojo-rbx/rojo --pattern "*linux*"
          unzip -o rojo-*linux*.zip
          chmod +x rojo

      - name: Build EasyRoad.rbxm
        run: ./rojo build default.project.json -o EasyRoad.rbxm

      - name: Upload plugin artifact
        uses: actions/upload-artifact@v4
        with:
          name: EasyRoad
          path: EasyRoad.rbxm
          if-no-files-found: error
