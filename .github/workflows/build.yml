name: Build plugin

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Explicit token scopes (repo default is read-only).
permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-build:
    name: Validate + build plugin
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate road and structure geometry
        run: python tools/preview/validate.py

      # Pure-Python builder (no Rojo binary). Produces Studio-loadable .rbxmx.
      - name: Build AGPL plugin artifacts
        run: python tools/build_rbxmx.py

      - name: Check distribution licenses and source freshness
        run: |
          python tools/check_distribution.py
          git diff --exit-code -- dist src/LicenseNotices.lua

      - name: Install Rojo
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download v7.6.1 --repo rojo-rbx/rojo --pattern "*linux-x86_64.zip" --output rojo.zip \
            || gh release download v7.6.1 --repo rojo-rbx/rojo --pattern "*linux*" --output rojo.zip
          unzip -o rojo.zip
          chmod +x rojo
          ./rojo --version

      - name: Build EasyRoad.rbxm
        run: |
          ./rojo build default.project.json -o EasyRoad.rbxm
          ./rojo build default.project.json -o /tmp/EasyRoad-rojo.rbxmx
          python tools/check_distribution.py --rojo-xml /tmp/EasyRoad-rojo.rbxmx

      - name: Upload plugin artifacts
        uses: actions/upload-artifact@v4
        with:
          name: EasyRoad
          path: |
            EasyRoad.rbxm
            dist/EasyRoad.rbxmx
            dist/EasyRoad-OSS.rbxmx
            LICENSE
            THIRD_PARTY_NOTICES.md
          if-no-files-found: error
